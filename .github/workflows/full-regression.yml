name: Full regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.node == 24 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {node: 22, os: ubuntu-latest}
          - {node: 22, os: windows-latest}
          - {node: 24, os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run strategy:validate
      - name: Verify atomic report writer on Windows
        if: runner.os == 'Windows'
        run: node --test keyword-research/test/atomic-report.test.js
      - run: npm test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
