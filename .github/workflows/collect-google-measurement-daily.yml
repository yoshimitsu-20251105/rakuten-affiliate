name: Collect private daily measurement
on:
  schedule:
    - cron: '0 0 * * *' # 09:00 JST
permissions:
  contents: read
concurrency:
  group: private-daily-measurement
  cancel-in-progress: false
jobs:
  measure:
    if: github.repository_id == '1336245988' && github.ref == 'refs/heads/master' && github.event_name == 'schedule' && vars.DAILY_MEASUREMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: google
        with:
          workload_identity_provider: projects/461541819464/locations/global/workloadIdentityPools/github-affiliate-daily/providers/github-actions-schedule
          service_account: website-analytics-reader@plenary-justice-369508.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly,https://www.googleapis.com/auth/analytics.readonly
          create_credentials_file: false
          export_environment_variables: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: storage
        with:
          workload_identity_provider: projects/461541819464/locations/global/workloadIdentityPools/github-affiliate-daily/providers/github-actions-schedule
          service_account: website-measurement-store@plenary-justice-369508.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/devstorage.read_write
          create_credentials_file: false
          export_environment_variables: false
      - name: Collect and store the private snapshot
        env:
          DAILY_MEASUREMENT_LIVE: 'true'
          EXPERIMENT_GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          DAILY_STORAGE_ACCESS_TOKEN: ${{ steps.storage.outputs.access_token }}
          DAILY_MEASUREMENT_BUCKET: ${{ vars.DAILY_MEASUREMENT_BUCKET }}
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          node experiment-measurement/daily-cli.js
      - name: Record the workflow failure for GitHub Actions notifications
        if: failure()
        run: echo 'Daily measurement failed. Inspect the failed step; measurement data is private.' >> "$GITHUB_STEP_SUMMARY"
