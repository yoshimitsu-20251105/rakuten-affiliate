{
  "name": "日次の監査・検証のみ（公開なし）",
  "on": {
    "schedule": [
      {
        "cron": "7 22 * * *"
      }
    ],
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "pages": "read"
  },
  "jobs": {
    "audit": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "監査用checkout",
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Node.js",
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "strategy検証",
          "run": "npm run strategy:validate"
        },
        {
          "name": "Safety・実験終了・共通guard・保護対象の検証",
          "run": "node --test keyword-research/test/publishing-safety-model.test.js keyword-research/test/publishing-safety-store.test.js keyword-research/test/publishing-safety-cli.test.js keyword-research/test/experiment-review-closure.test.js keyword-research/test/daily-workflow-fail-closed.test.js"
        },
        {
          "name": "内部リンク検査",
          "run": "node check-links.js"
        },
        {
          "name": "公開見送り状態と検証結果",
          "if": "${{ always() }}",
          "run": "node daily-audit/cli.js --checks-status ${{ job.status }}"
        }
      ]
    }
  }
}
