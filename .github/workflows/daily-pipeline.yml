name: 毎日の商品選定・サイト更新

on:
  schedule:
    # 22:07 UTC = 07:07 JST(毎正時ちょうどは混雑しやすいため7分ずらす)
    - cron: "7 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 商品選定
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_SECRET: ${{ secrets.RAKUTEN_SECRET }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: node select-products.js

      - name: サイト生成
        run: node generate-site.js

      - name: SNS投稿文生成
        run: node generate-social-posts.js

      - name: APIエラーの有無を確認
        id: apierr
        run: |
          if [ -s api-errors.log ]; then
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
          fi

      - name: commit・push
        id: commit
        run: |
          git config user.name "rakuten-affiliate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto: $(date +'%Y-%m-%d') 商品選定・サイト更新 (GitHub Actions)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "新規商品なし。変更なし。"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 【要確認】APIエラー通知メール
        if: steps.apierr.outputs.has_errors == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[rakuten-affiliate] 【要確認】楽天APIエラー - ${{ github.run_id }}"
          to: ${{ secrets.GMAIL_ADDRESS }}
          from: rakuten-affiliate automation <${{ secrets.GMAIL_ADDRESS }}>
          body: |
            商品選定中に楽天APIエラーが発生しました。IP制限やAPIキーの有効期限などを確認してください。
            詳細は添付の api-errors.log を確認してください。

            実行ログ: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: api-errors.log

      - name: サイト更新完了メール
        if: steps.commit.outputs.pushed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[rakuten-affiliate] サイト更新・公開完了 - ${{ github.run_id }}"
          to: ${{ secrets.GMAIL_ADDRESS }}
          from: rakuten-affiliate automation <${{ secrets.GMAIL_ADDRESS }}>
          body: |
            商品選定・サイト更新・GitHubへのpushが完了し、公開サイトに反映されました(GitHub Actions上で実行)。
            SNS投稿文の下書きは、このメールに添付した social-posts.txt を確認してください。

            公開サイト: https://yoshimitsu-20251105.github.io/rakuten-affiliate/
            リポジトリ: https://github.com/${{ github.repository }}
            実行ログ: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: social-posts.txt

      - name: push失敗時の通知メール
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[rakuten-affiliate] 【要確認】パイプライン失敗 - ${{ github.run_id }}"
          to: ${{ secrets.GMAIL_ADDRESS }}
          from: rakuten-affiliate automation <${{ secrets.GMAIL_ADDRESS }}>
          body: |
            毎日のパイプラインが途中で失敗しました。実行ログを確認してください。

            実行ログ: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
